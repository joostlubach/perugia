# Every question's wording, in quiz order.
#   title:  short label
#   host:   long text, shown on the big screen while you read it out
#   player: short text, on phones and on the big screen while answering and at the reveal
#
# Line breaks show up on screen. For several lines, start the text with |- and
# indent the lines below it (see ruben); a blank line gives a blank line.

lake:
  title: The Lake
  host: |-
    On Thursday, or Wednesday, honestly who can remember, we drove 1,5 hours to swim in an ice cold lake. Which famous story is inspired by the region around that lake?
  player: |-
    Which story is inspired by the lake?

assisi:
  title: Assisi
  host: |-
    We visited the town of Assisi. Because Pietro told us the churches wouldn't close at 18:00, we never got to visit the famous saint there. But were there more? Which saint(s) do we associate with the town of Assisi?
  player: |-
    Which saint(s) do we associate with the town of Assisi? Select all that apply.

pedro:
  title: Pedro
  host: How many times does the word "Pedro" appear in Raffaella Carra's song "Pedro"?
  player: Drag a Pedro to the box for each Pedro in the song.

