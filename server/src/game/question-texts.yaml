# Every question's wording, in quiz order.
#   title:  short label
#   host:   long text, shown on the big screen while you read it out
#   player: short text, on phones and on the big screen while answering and at the reveal
#
# Line breaks show up on screen. For several lines, start the text with |- and
# indent the lines below it (see ruben); a blank line gives a blank line.

villa:
  title: The villa
  host: Let's see who's been paying any attention. What was the name of the house we stayed at?
  player: What was the name of the house we stayed at?

house:
  title: The house
  host: What was the surname of the family that owned the house?
  player: What was the surname of the family that owned the house?

ancestor:
  title: Famous ancestor
  host: What famous artist does the Di Serego family descend from?
  player: What famous artist does the Di Serego family descend from?

wherePerugia:
  title: Where were we?
  host: But where exactly is Perugia anyway? Drag yourself to Perugia on the map!
  player: Drag yourself to Perugia on the map!

travel:
  title: On the way
  host: |-
    Getting a gaggle of 16 gays to a house in Perugia is not an easy task. Some people wanted to drive, some people wanted to take the plane, some people decided that they didn't want to pay for toll in Switzerland, and decided to take a 500km detour through Austria.
  player: |-
    Drag each person to their means of transport for _arriving_ to Perugia!

problem:
  title: The problem
  host: What was the problem?
  player: What was the problem?

aircoFixed:
  title: The airco
  host: And when was the airco fixed?
  player: When was the airco fixed?

poolParty:
  title: Pool party
  host: |-
    We made it a bit bont the second night in the pool. Not as bont as the third night, but still. Due to jumping off of the wall, the pool lost a wee bit of water. How many liters?
  player: |-
    How many liters of water did the pool lose after the first pool party?

bowie:
  title: Bowie's scratches
  host: |-
    Everyone fell into the pool at the pool party. But not everyone without serious injury. Draw as best as you can the marks on Bowie's side from the pool party
  player: Draw the scratches as best as you can

jumprope:
  title: Jumprope
  host: |-
    While most of us were being lazy ass bitches at the pool, not Sanne! How many jumprope jumps did Sanne do in total?
  player: How many jumprope jumps did Sanne do in total?

cigarettes:
  title: Sigaretten
  host: What is the price of 5 sloffen sigaretten in Perugia?
  player: What is the price of 5 sloffen sigaretten in Perugia?

ham:
  title: Ham cutting
  host: |-
    It was a good ham, but difficult to cut. Why don't you try it yourself?
  player: |-
    Why don't you cut the ham exactly in half? The closer you equally bisect the ham the better.

wine:
  title: Wine
  host: How much wine?
  player: How much wine?

kyle:
  title: Kyle's secret ingredient
  host: |-
    Kyle made a red wine spaghetti with a secret ingredient. But what was the secret ingredient?
  player: |-
    What is the secret ingredient in Kyle's Red Wine Spaghetti?

ruben:
  title: Senze glutine
  host: |-
    Ciao tutti! Welcome to Osteria L'Attaccabrighe!

    You went with your friends to Osteria L'Attaccabrighe. The only problem: you're Ruben, so you don't eat gluten! Order an antipasto, a primo, a secondo and a dolce without shitting your pants the entire night!
  player: |-
    Order an antipasto, a primo, a secondo and a dolce, but stay off the gluten!

perugia:
  title: Perugia
  host: |-
    Some of us _did_ go to Perugia to learn something about the history of the region. What people used to live in Perugia before Octavian burnt their terracotta asses?
  player: |-
    What people used to live in Perugia before Octavian burnt their terracotta asses?

pool:
  title: The swimming pool
  host: |-
    What was the reason the swimming pool was where it was?
  player: |-
    What was the reason the swimming pool was where it was?

serverRoom:
  title: Server room
  host: What did Leonardo do to power his server room at home?
  player: What did Leonardo do to power his server room at home?

dogs:
  title: Dogs
  host: How many dogs did we have in total?
  player: How many dogs did we have in total?

singer:
  title: She dead
  host: A famous singer died during our trip. Name two of her hit songs.
  player: Name two hit songs of the singer who died during our trip.

pedro:
  title: Pedro
  host: How many times does the word "Pedro" appear in Raffaella Carra's song "Pedro"?
  player: Drag a Pedro to the box for each Pedro in the song.

assisi:
  title: Assisi
  host: |-
    We visited the town of Assisi. Because Pietro told us the churches wouldn't close at 18:00, we never got to visit the famous saint there. But were there more? Which saint(s) do we associate with the town of Assisi?
  player: |-
    Which saint(s) do we associate with the town of Assisi? Select all that apply.

lake:
  title: The Lake
  host: |-
    On Thursday we drove 1,5 hours to swim in an ice cold lake. Which famous story is inspired by the region around that lake?
  player: |-
    Which story is inspired by the lake?

festival:
  title: Village festival
  host: |-
    At the village festival, we arrived when the number was at 182. We had to wait a shitload of time for our number. But what was our number?
  player: |-
    Which number did we have at the village festival?

noKarting:
  title: No karting
  host: Who didn't go karting?
  player: Who didn't go karting?

karting:
  title: Karting
  host: |-
    We had to go karting. Apart from a little incident – more about that later – we had a great time. There was a loser group and a winner group. But who finished where?
  player: |-
    Who finished where in karting? Put both groups in the right order.

kartingCrash:
  title: The incident
  host: |-
    Karting was not only fun, but some serious thing happened. Let's see if you were in too much shock to remember the details.
  player: |-
    Drag elements onto the map to create as much of an accurate situation sketch as possible.

splitser:
  title: Splitser
  host: How much money did we spend in total, according to Splitser?
  player: How much did we spend in total, according to Splitser?
