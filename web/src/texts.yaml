# All UI texts, grouped by screen. Change the wording freely.
#
# {name} placeholders are filled in by the app -- keep them as they are.
# A key ending in _one is used instead of the plain key when {count} is 1.
# Keep the double quotes around each text.
# For a line break, use \n inside the quotes: "First line\nSecond line".

common:
  loading: "Loading..."

landing:
  title: "🇮🇹 Perugia Quiz Party 🍫"
  subtitle: "Mamma mia, get ready for some bellissimo trivia!"
  hostButton: "📺 I'm the Host"

host:
  questionHeader: "Question {number} / {total} · {category} · {title}"

  setup:
    title: "Host Setup"
    createRoom: "🎉 Create Room"

  # Badge on every screen of a runthrough, where everyone missing is played by an NPC.
  runthrough: "🧪 Runthrough"

  lobby:
    title: "🇮🇹 Ciao tutti 🇮🇹"
    scanToJoin: "Scan to join on your phone"
    orGoToUrl: "or go to this URL on your phone"
    playersJoined: "{count} players joined"
    playersJoined_one: "{count} player joined"
    start: "🚀 Andiamo!"

  category:
    next: "Andiamo! ▶"

  intro:
    header: "Question {number} / {total}"
    start: "Vai!"

  question:
    answered: "answered"
    # Shown under the question while players answer, per question type.
    money_vase: "Drag the money into the vase. No refunds: bet money is bet!"
    podium_order: "Drag everyone on the podium in finishing order."
    situation_sketch: "Sketch the situation on your phone!"
    ham_cut: "Find the line that cuts the ham exactly in half!"
    trace_marks: "Draw the scratch marks!"
    multi_select: "Select all that apply -- more than one answer may be correct!"
    drag_count: "Drag as many \"{label}\" as you count, then lock it in!"
    open_answer: "Type your answer on your phone!"
    multi_text: "Type your answers on your phone!"
    map_pin: "Drag yourself to the right spot on your phone!"
    photo_floors: "⚡ Lightning round! Pick the floor on your phone, quick!"

  reveal:
    title: "The right answer"
    hamGoal: "The goal was a perfect 50/50 split by area."
    distanceKm: "{name}: {km} km"
    # Showing one player's answer (picked with the button in the top right).
    pickPlayer: "👤 Show one answer"
    showAll: "👥 Show all answers"
    answerOf: "{name}'s answer"
    noAnswerFrom: "{name} didn't answer"
    pointsEarned: "+{points} points"
    correctWas: "Correct: {answer}"
    kmOff: "{km} km off"
    scorePercent: "Score: {score}%"
    # Open question. The right answer is what {name} (Kyle) typed; the host only
    # types it in when he didn't answer.
    typeCorrectAnswer: "Type the correct answer"
    checkAnswers: "✅ Check answers"
    noAnswer: "(nothing)"
    featuredAnswer: "{name} says it's..."
    # Open question with a rival (Kyle's secret ingredient, with Ruben as the rival).
    refusedToAnswer: "{name} refused to answer"
    # Also when {name} typed something that isn't a word, as phones hand in whatever was typed.
    penalty: "{name} didn't give a real answer, so that's {points} points 😈"
    revealRival: "But {keeper} did tell {rival}, so what did {rival} answer?"
    rivalAnswered: "{rival} answered"
    whichCounts: "Which answer counts?"
    pickAnswer: "✅ {name}'s answer"
    pickNobody: "🚫 Nobody gets points"
    nobodyScores: "Nobody gets points! 🤷"
    # {keeper} is the player whose answer is the right one (Kyle), {name} the one shown (Ruben).
    playerAnswer: "By the way, Kyle DID tell {name}, and {name} answered"
    correctCount: "{count} of {total} got it right"
    # Lightning round, under each photo.
    gotItRight: "{count} got it right"
    # Questions with partial credit; "close" is what the phones call "Cosi cosa".
    spotOnCount: "{count} of {total} spot on, {close} close"
    toLeaderboard: "📊 Show Leaderboard"
    toFinale: "🏁 Finish"
    toNextQuestion: "➡️ Next Question"

  leaderboard:
    title: "Classifica 🏆"
    toFinalResults: "🏁 Final Results"
    toNextQuestion: "➡️ Next Question"

  finale:
    title: "Finito! 🏁"
    subtitle: "That was the last question. Ready for the results? And, remember, playing is more important than winning!"
    showResults: "🏆 Show the results"

  final:
    title: "🎉 Tanti Auguri! 🎉"
    subtitle: "Grazie mille for playing, all y'all people!"

  jump:
    label: "Go to question (1–{total})"
    go: "Go"
    # Hold Alt to turn "New room" into "New runthrough".
    resume: "▶️ Resume"
    newRoom: "🆕 New room"
    newRunthrough: "🧪 New runthrough"
    confirmNewRoom: "A game is in progress. Start over in a new room? Everyone will have to join again."
    finale: "🏁 Pre-finale"
    results: "🏆 Results"

player:
  scan:
    title: "Scan to join 📷"
    subtitle: "Scan the QR code on the big screen to join the quiz."

  join:
    title: "Who are you? 🎊"
    join: "🚀 Andiamo!"
    pickAvatarFirst: "Pick an avatar first"

  lobby:
    title: "You're in! 🍕"
    subtitle: "Sit tight, the host will start soon..."
    soundOn: "🔊 Turn the sound on your phone on for an optima esperanza!"
    playersInRoom: "{count} players in the room"
    playersInRoom_one: "{count} player in the room"

  intro:
    header: "Question {number} / {total}"
    title: "Look at the screen! 👀"
    subtitle: "You can answer once the question has been read out."

  question:
    answeredTitle: "Answer sent! ✅"
    answeredSubtitle: "Waiting for everyone else..."

  reveal:
    correct: "Perfetto! 🎉"
    partlyCorrect: "Cosi cosa! 👌"
    wrong: "Helacchio! 😅"
    timeUp: "Out of time! ⏰"
    # Open question, while the host hasn't typed in the right answer yet.
    awaitingGradingTitle: "Hmm... 🤔"
    awaitingGradingSubtitle: "The host is checking the answers. Look at the screen!"
    points: "+{points} points"
    penalty: "{points} points for not giving a real answer 😈"
    noPoints: "Mehp"
    totalScore: "Total score: {score}"

  leaderboard:
    title: "You're #{rank}!"
    subtitle: "out of {count} players"
    totalScore: "Total score: {score}"

  finale:
    title: "Finito! 🏁"
    subtitle: "That was the last question. The results are coming up on the big screen..."

  final:
    title: "Finito! {medal}"
    subtitle: "You finished #{rank} of {count}"
    finalScore: "Final score: {score}"
    goodbye: "Grazie for playing — see you next reunion!"

# The answer controls on phones (also used on the /test page).
boards:
  dragCount:
    hint: "Drag {label} in here, once per guess"
    done: "✅ Done dragging"
  openAnswer:
    placeholder: "Your answer..."
    done: "✅ Send"
  multiText:
    placeholder: "Answer {number}..."
    done: "✅ Send"
  hamCut:
    done: "🔪 Lock in the cut"
  menu:
    kicker: "~ Perugia ~"
    name: "Osteria L'Attaccabrighe"
    subtitle: "Menù del giorno"
    glutenFree: "senza glutine ✓"
    order: "🍽️ Place order"
  moneyVase:
    noRefunds: "No refunds: bet money is bet! 🙅"
    done: "🏺 Bet it"
  multiSelect:
    done: "✅ Lock in answers"
  photoFloors:
    progress: "⚡ Photo {number} / {total}"
  podium:
    allPlaced: "Everyone's on the podium"
    done: "🏁 Lock it in"
  mapPin:
    moveHint: "Drag your pin around until it's spot on"
    done: "📍 Lock it in"
  travelMap:
    allPlaced: "Everyone's on the map"
    done: "🗺️ Lock it in"
  sketch:
    hint: "Tap a piece on the map to turn it with ↻. Drop it back here to remove it."
    allPlaced: "Everything's on the map"
    done: "🚨 Lock in the sketch"
  traceMarks:
    undo: "↩️ Undo"
    clear: "🗑️ Clear"
    done: "🖍️ Done drawing"

# Soundboard: `label` is the button on phones, `callout` the speech bubble on the big screen.
reactions:
  letsgo:
    label: "Let's go!"
    callout: "Let's-a go!"
  mammamia:
    label: "Mamma mia!"
    callout: "Mamma mia!"
  mario:
    label: "Mario!"
    callout: "It's-a me, Mario!"
  luigi:
    label: "Oohooh"
    callout: "Oohooh!"
  losing:
    label: "Nooo"
    callout: "Nooooo!"
  gibberish:
    label: "🇮🇹"
    callout: "Beepedeboopedie!"
  congratulations:
    label: "Bravo!"
    callout: "Congratulations!"
