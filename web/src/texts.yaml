# All UI texts, grouped by screen. Change the wording freely.
#
# {name} placeholders are filled in by the app -- keep them as they are.
# A key ending in _one is used instead of the plain key when {count} is 1.
# Keep the double quotes around each text.

common:
  loading: "Loading..."

landing:
  title: "🇮🇹 Perugia Quiz Party 🍫"
  subtitle: "Mamma mia, get ready for some bellissimo trivia!"
  hostButton: "📺 I'm the Host"

host:
  questionHeader: "Question {number} / {total} · {title}"

  setup:
    title: "Host Setup"
    createRoom: "🎉 Create Room"

  lobby:
    title: "🇮🇹 Ciao tutti 🇮🇹"
    scanToJoin: "Scan to join on your phone"
    orGoToUrl: "or go to this URL on your phone"
    playersJoined: "{count} players joined"
    playersJoined_one: "{count} player joined"
    start: "🚀 Andiamo!"

  intro:
    start: "Vai!"

  question:
    answered: "answered"
    # Shown under the question while players answer, per question type.
    money_vase: "Drag the money into the vase. No refunds: bet money is bet!"
    podium_order: "Drag everyone on the podium in finishing order."
    plate_assignment: "Drag the primo and secondo to the correct plates."
    ham_cut: "Find the line that cuts the ham exactly in half!"
    trace_marks: "Draw the scratch marks!"
    multi_select: "Select all that apply -- more than one answer may be correct!"
    drag_count: "Drag as many \"{label}\" as you count, then lock it in!"

  reveal:
    title: "Of course it was"
    hamGoal: "The goal was a perfect 50/50 split by area."
    toLeaderboard: "📊 Show Leaderboard"
    toFinale: "🏁 Finish"
    toNextQuestion: "➡️ Next Question"

  leaderboard:
    title: "Classifica 🏆"
    toFinalResults: "🏁 Final Results"
    toNextQuestion: "➡️ Next Question"

  finale:
    title: "Finito! 🏁"
    subtitle: "That was the last question. Ready for the results? And, remember, playing is more important than winning!"
    showResults: "🏆 Show the results"

  final:
    title: "🎉 Tanti Auguri! 🎉"
    subtitle: "Grazie mille for playing, all y'all people!"

  jump:
    label: "Go to question (1–{total})"
    go: "Go"

player:
  scan:
    title: "Scan to join 📷"
    subtitle: "Scan the QR code on the big screen to join the quiz."

  join:
    title: "Who are you? 🎊"
    join: "🚀 Andiamo!"
    pickAvatarFirst: "Pick an avatar first"

  lobby:
    title: "You're in! 🍕"
    subtitle: "Sit tight, the host will start soon..."
    playersInRoom: "{count} players in the room"
    playersInRoom_one: "{count} player in the room"

  intro:
    header: "Question {number} / {total}"
    title: "Look at the screen! 👀"
    subtitle: "You can answer once the question has been read out."

  question:
    header: "Question {number} / {total} · {title} · {points} pts"
    answeredTitle: "Answer sent! ✅"
    answeredSubtitle: "Waiting for everyone else..."

  reveal:
    correct: "Perfetto! 🎉"
    partlyCorrect: "Cosi cosa! 👌"
    wrong: "Helacchio! 😅"
    timeUp: "Out of time! ⏰"
    points: "+{points} points"
    noPoints: "Mehp"
    totalScore: "Total score: {score}"

  leaderboard:
    title: "You're #{rank}!"
    subtitle: "out of {count} players"
    totalScore: "Total score: {score}"

  finale:
    title: "Finito! 🏁"
    subtitle: "That was the last question. The results are coming up on the big screen..."

  final:
    title: "Finito! {medal}"
    subtitle: "You finished #{rank} of {count}"
    finalScore: "Final score: {score}"
    goodbye: "Grazie for playing — see you next reunion!"

